<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html.secret-mode, body.secret-mode { background:#000; }
    .secret-overlay { position:fixed; inset:0; z-index:10; background:#000; display:none; align-items:center; justify-content:center; flex-direction:column; opacity:1; transition:opacity 3s ease; }
    .secret-overlay.active { display:flex; }
    .secret-overlay.blackout { opacity:0; }
    .secret-image { display:block; width:min(38vw, 240px); height:auto; image-rendering:pixelated; opacity:0; transition:opacity 8s linear; }
    .secret-image.visible { opacity:1; }
    .secret-dialogue { position:absolute; left:50%; bottom:7vh; transform:translateX(-50%); width:min(820px, 90vw); min-height:90px; border:3px solid #fff; background:#000; padding:20px 24px; color:#fff; font:28px "VT323", monospace; text-align:left; line-height:1.25; white-space:pre-wrap; display:none; }
    .secret-dialogue.active { display:block; }
    .secret-dialogue:after { content:"▼"; position:absolute; right:18px; bottom:7px; font-size:18px; animation:dialogueBlink 1s steps(2,end) infinite; }
    @keyframes dialogueBlink { 50% { opacity:0; } }
    @media(max-width:600px) { .secret-image { width:min(58vw, 220px); } .secret-dialogue { font-size:23px; padding:15px 17px; bottom:4vh; } }
    /* JINCHI secret: layered images with a subtle pixel-wave distortion. */
    #jinchiOverlay { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; overflow:hidden; background:#000; }
    #jinchiOverlay.active { display:flex; }
    .jinchi-picture { position:absolute; max-width:94vw; max-height:94vh; width:auto; height:auto; object-fit:contain; image-rendering:pixelated; filter:url(#pixelWave); }
    #jinchiTop { opacity:0; transition:opacity 136s linear; }
    #jinchiOverlay.active #jinchiTop { opacity:1; }
    @media (prefers-reduced-motion: reduce) { #jinchiTop { transition-duration:1s; } }
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: #000;
      color: #fff;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "VT323", monospace;
    }

    .scene {
      width: 100%;
      text-align: center;
      transform: translateY(-2vh);
    }

    .question {
      margin: 0 0 24px;
      padding: 0 20px;
      font-family: "Silkscreen", "VT323", monospace;
      font-size: clamp(20px, 2.6vw, 34px);
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.1;
      animation: pixelFloat 5.5s steps(5, end) infinite;
      text-shadow:
        1px 0 rgba(255,255,255,.35),
        -1px 0 rgba(255,255,255,.18),
        0 0 12px rgba(255,255,255,.08);
    }

    .answer {
      width: min(270px, 65vw);
      height: 36px;
      padding: 4px 10px;
      border: 1px solid rgba(255,255,255,.20);
      border-radius: 0;
      outline: none;
      background: rgba(255,255,255,.02);
      color: #fff;
      font: 400 18px "VT323", monospace;
      letter-spacing: .04em;
      text-align: center;
      caret-color: #fff;
      box-shadow: none;
    }

    .answer:focus {
      border-color: rgba(255,255,255,.48);
      box-shadow: 0 0 12px rgba(255,255,255,.05);
    }

    .response-line {
      min-height: 26px;
      margin: 14px auto 0;
      padding: 0 20px;
      font-size: clamp(18px, 2vw, 25px);
      letter-spacing: .035em;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 1.2s ease, transform 1.2s ease;
      text-shadow: 0 0 10px rgba(255,255,255,.08);
      pointer-events: none;
    }

    .response-line.show {
      opacity: .82;
      transform: translateY(0);
    }

    .response-line.fade {
      opacity: 0;
      transform: translateY(-3px);
    }

    .answer::placeholder {
      color: rgba(255,255,255,.22);
      opacity: 1;
    }

    @keyframes pixelFloat {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(1px, -1px); }
      40% { transform: translate(0, -2px); }
      60% { transform: translate(-1px, -1px); }
      80% { transform: translate(0, -2px); }
    }

    #uncOverlay {
      position: fixed; inset: 0; z-index: 100000; display: none;
      align-items: center; justify-content: center; background: #000;
    }
    #uncOverlay.active { display: flex; }
    #uncVideo { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #trienOverlay {
      position: fixed; inset: 0; z-index: 100001; display: none;
      align-items: center; justify-content: center; background: #000;
    }
    #trienOverlay.active { display: flex; }
    #trienGif { max-width: 100vw; max-height: 100vh; width: auto; height: auto; object-fit: contain; image-rendering: pixelated; }
  </style>
</head>
<body>
  <audio id="mainMusic" src="LOVEGOD.mp3" loop preload="auto"></audio>

  <main class="scene">
    <h1 class="question">How long did it take her to love God?</h1>
    <input id="answer" class="answer" type="text" autocomplete="off" spellcheck="false" aria-label="Answer" />
    <div id="responseLine" class="response-line" aria-live="polite"></div>
  </main>

  <div id="secretOverlay" class="secret-overlay" aria-hidden="true">
    <img id="secretImage" class="secret-image" src="FRIEND_overworld_vision.gif" alt="" />
    <div id="secretDialogue" class="secret-dialogue" aria-live="polite"></div>
  </div>

  <!-- Pixel-wave filter used only by the JINCHI secret. -->
  <svg aria-hidden="true" width="0" height="0" style="position:absolute">
    <filter id="pixelWave" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.028" numOctaves="1" seed="8" result="noise">
        <animate attributeName="baseFrequency" dur="3.6s" values="0.018 0.028;0.025 0.018;0.018 0.028" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div id="jinchiOverlay" aria-hidden="true">
    <img class="jinchi-picture" id="jinchiBase" src="JINCHI%20WAS%20A%20IDIOT.png" alt="" />
    <img class="jinchi-picture" id="jinchiTop" src="HERES%20WHY.png" alt="" />
  </div>
  <audio id="jinchiAudio" src="JINCHI%20WAS%20A%20IDIOT.mp3" preload="auto"></audio>


  <div id="uncOverlay" aria-hidden="true">
    <video id="uncVideo" src="UNC%20PUSHING%2041.mp4" playsinline controls preload="auto"></video>
  </div>

  <div id="trienOverlay" aria-hidden="true">
    <img id="trienGif" src="TRIEN.gif" alt="" />
  </div>
  <audio id="trienAudio" src="TRUE.mp3" preload="auto"></audio>

  <script>
    const mainMusic = document.getElementById("mainMusic");
    function startMainMusic() {
      if (!mainMusic || document.querySelector(".scene").style.display === "none") return;
      mainMusic.play().catch(() => {
        // Browsers may block audio until the visitor interacts with the page.
      });
    }
    // Try autoplay, then retry on the visitor's first interaction if blocked.
    startMainMusic();
    document.addEventListener("pointerdown", startMainMusic, { once: true });
    document.addEventListener("keydown", startMainMusic, { once: true });

    const uncOverlay = document.getElementById("uncOverlay");
    const uncVideo = document.getElementById("uncVideo");
    let uncStarted = false;

    function beginUncVideo() {
      if (uncStarted) return;
      uncStarted = true;
      if (mainMusic) mainMusic.pause();
      document.querySelector(".scene").style.display = "none";
      const existingSecret = document.getElementById("secretOverlay");
      if (existingSecret) existingSecret.classList.remove("active");
      const jinchi = document.getElementById("jinchiOverlay");
      if (jinchi) jinchi.classList.remove("active");
      uncOverlay.classList.add("active");
      uncOverlay.setAttribute("aria-hidden", "false");
      uncVideo.currentTime = 0;
      uncVideo.play().catch(() => {
        // If autoplay is blocked, the visible video controls let the visitor press Play.
      });
    }

    const trienOverlay = document.getElementById("trienOverlay");
    const trienGif = document.getElementById("trienGif");
    const trienAudio = document.getElementById("trienAudio");
    let trienStarted = false;

    function beginTrienSecret() {
      if (trienStarted) return;
      trienStarted = true;
      if (mainMusic) mainMusic.pause();
      if (backgroundAudio) backgroundAudio.pause();
      if (jinchiAudio) jinchiAudio.pause();
      if (uncVideo) uncVideo.pause();
      document.querySelector(".scene").style.display = "none";
      secretOverlay.classList.remove("active");
      jinchiOverlay.classList.remove("active");
      uncOverlay.classList.remove("active");
      trienOverlay.classList.add("active");
      trienOverlay.setAttribute("aria-hidden", "false");
      trienGif.src = "TRIEN.gif";
      trienAudio.currentTime = 0;
      trienAudio.play().catch(() => {
        // The browser may require a direct user gesture to start audio.
      });
    }

    const input = document.getElementById("answer");
    const responseLine = document.getElementById("responseLine");
    let fadeTimer;
    const secretOverlay = document.getElementById("secretOverlay");
    const secretImage = document.getElementById("secretImage");
    const secretDialogue = document.getElementById("secretDialogue");
    let secretStarted = false;
    let dialogueIndex = 0;
    let typingTimer = null;
    let lineTimer = null;
    let backgroundAudio = null;
    const jinchiOverlay = document.getElementById("jinchiOverlay");
    const jinchiAudio = document.getElementById("jinchiAudio");
    let jinchiStarted = false;

    function beginJinchiSecret() {
      if (jinchiStarted) return;
      jinchiStarted = true;
      if (mainMusic) mainMusic.pause();
      // Stop the other secret's audio if it happens to be active.
      if (backgroundAudio) backgroundAudio.pause();
      document.querySelector(".scene").style.display = "none";
      secretOverlay.classList.remove("active");
      jinchiOverlay.classList.add("active");
      jinchiOverlay.setAttribute("aria-hidden", "false");
      const topImage = document.getElementById("jinchiTop");
      // Restart the long fade each time the secret is opened.
      topImage.style.transition = "none";
      topImage.style.opacity = "0";
      void topImage.offsetWidth;
      topImage.style.transition = "opacity 136s linear";
      topImage.style.opacity = "1";
      jinchiAudio.currentTime = 0;
      jinchiAudio.play().catch(() => {
        // Some browsers require another user gesture before audio can play.
      });
    }
    const secretLines = [
      "YOUR PARENTS?",
      "IF YOU ARE LENNY.. YOU MET YOUR FATHER..",
      "YOUR MOTHER HOWEVER..",
      "WELL..",
      "YOULL BE MEETING HER SOON..",
      "TO THE REST OF YOU..",
      "I CAN'T EXACTLY SAY WHAT HAPPENED.",
      "BUT YOULL FIND OUT SOON...",
      "DO YOU HEAR ME?",
      "CANCER?",
      "SHADOW?",
      "GUANYIN?",
      "TOUCH?",
      "FLAME?",
      "PANDA?",
      "ROCK?",
      "STRENGTH?",
      "ILL BE SEEING YOU..."
    ];
    const laughingLines = new Set([
      "YOULL BE MEETING HER SOON..", "BUT YOULL FIND OUT SOON...", "CANCER?",
      "SHADOW?", "GUANYIN?", "TOUCH?", "FLAME?", "PANDA?", "ROCK?"
    ]);

    // If the ending has already happened, keep the page permanently black until RESET.
    if (localStorage.getItem("parentsSecretFinished") === "true") {
      document.body.innerHTML = "";
      document.body.style.cssText = "margin:0;background:#000;width:100vw;height:100vh;";
    }
    let resetKeyBuffer = "";
    document.addEventListener("keydown", (event) => {
      if (localStorage.getItem("parentsSecretFinished") !== "true") return;
      if (event.key.length === 1 && /[a-z]/i.test(event.key)) {
        resetKeyBuffer = (resetKeyBuffer + event.key).slice(-5);
        if (resetKeyBuffer.toLowerCase() === "reset") {
          localStorage.removeItem("parentsSecretFinished");
          location.reload();
        }
      } else if (event.key === "Backspace") {
        resetKeyBuffer = resetKeyBuffer.slice(0, -1);
      }
    });

    function beginSecret(skipWait = false) {
      if (secretStarted || localStorage.getItem("parentsSecretFinished") === "true") return;
      secretStarted = true;
      if (mainMusic) mainMusic.pause();
      document.querySelector(".scene").style.display = "none";
      secretOverlay.classList.add("active");
      secretOverlay.setAttribute("aria-hidden", "false");
      // Audio starts from the user's Enter key gesture. Browsers may still block autoplay.
      backgroundAudio = new Audio("Background%20audio.mp3");
      backgroundAudio.loop = true;
      backgroundAudio.volume = 0.8;
      backgroundAudio.play().catch(() => {});
      if (skipWait) revealSecret();
      else setTimeout(revealSecret, 120000);
    }

    function revealSecret() {
      if (!secretStarted || localStorage.getItem("parentsSecretFinished") === "true") return;
      secretImage.src = "FRIEND_overworld_vision.gif";
      secretImage.classList.add("visible");
      // Dialogue starts only after the image's slow fade has completed.
      setTimeout(() => {
        if (secretStarted && localStorage.getItem("parentsSecretFinished") !== "true") showSecretLine();
      }, 8100);
    }

    function showSecretLine() {
      if (dialogueIndex >= secretLines.length) return;
      const line = secretLines[dialogueIndex];
      if (laughingLines.has(line)) {
        secretImage.src = "FRIEND_overworld_laugh.gif";
      } else {
        secretImage.src = "FRIEND_overworld_vision.gif";
      }
      secretDialogue.classList.add("active");
      secretDialogue.textContent = "";
      let charIndex = 0;
      clearInterval(typingTimer);
      typingTimer = setInterval(() => {
        secretDialogue.textContent = line.slice(0, ++charIndex);
        if (charIndex >= line.length) {
          clearInterval(typingTimer);
          if (line === "ILL BE SEEING YOU...") {
            setTimeout(() => {
              secretOverlay.classList.add("blackout");
              if (backgroundAudio) backgroundAudio.pause();
              setTimeout(() => {
                localStorage.setItem("parentsSecretFinished", "true");
                document.body.innerHTML = "";
                document.body.style.cssText = "margin:0;background:#000;width:100vw;height:100vh;";
              }, 3100);
            }, 1800);
          } else {
            lineTimer = setTimeout(() => { dialogueIndex++; showSecretLine(); }, 1450);
          }
        }
      }, 48);
    }

    function resetWebsite() {
      localStorage.removeItem("parentsSecretFinished");
      location.reload();
    }

    function showResponse(text) {
      clearTimeout(fadeTimer);

      responseLine.classList.remove("show", "fade");
      responseLine.textContent = text;

      // Restart the small fade-in animation.
      void responseLine.offsetWidth;
      responseLine.classList.add("show");

      fadeTimer = setTimeout(() => {
        responseLine.classList.remove("show");
        responseLine.classList.add("fade");
      }, 3600);
    }

    function getResponse(answer) {
      const responses = {
        candy: "Close... Why are you bringing her up?",
        chocolate: "Not her.. But she was cool.",
        coco: "Not her.. But she was cool.",
        porridge: "Lets not talk about her.",
        tyce: "My Best Friend",
        tizhae: "My Best Friend",
        intery: "A Good Friend",
        alex: "A New Friend?",
        grooti: "Oh. A New Friend?",
        tray: "Heh..",
        fire: "He was fun.",
        demon: "We Became Brothers.",
        ethan: "Why Do you know that name",
        buddha: "Hello?",
        alijah: "Yes?",
        k10: "What's Up?",
        ray: "Just Stop.",
        brap: "Dont.. Do this now.",
        sasha: "I Loved That Name.",
        god: "Mhm?",
        zoro: "Which One?",
        malik: "An Older Friend.",
        watterson: "Those little names we used to do",
        harris: "Those little names we used to do",
        forgotten: "No. Not Me.",
        breadcrumbs: "I Was Watching",
        tree: "Was Forgotten the Answer?",
        roofus: "Stupid Dog.",
        matter: "Why Is It Still So Hard To Be?",
        "tails of hell": "He Gave You The Eggs?",
        "erlang shen": "Too Early",
        sage: "Too Early"
      };

      if (Object.prototype.hasOwnProperty.call(responses, answer)) {
        return responses[answer];
      }

      return Math.random() < 0.5
        ? "What Does This Mean?"
        : "I think I misunderstood";
    }

    input.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;

      const answer = input.value
        .trim()
        .replace(/\s+/g, " ")
        .toLowerCase();

      if (!answer) return;

      if (answer === "reset") {
        resetWebsite();
        return;
      }

      if (answer === "where are my parents?") {
        beginSecret(false);
        return;
      }

      if (answer === "skip") {
        if (!secretStarted) {
          beginSecret(true);
        } else if (!secretImage.classList.contains("visible")) {
          // Skip the initial two-minute wait and begin the scene immediately.
          revealSecret();
        }
        return;
      }

      if (answer === "unc pushing 41") {
        beginUncVideo();
        return;
      }

      if (answer === "trien") {
        beginTrienSecret();
        return;
      }

      if (answer === "jinchi was a idiot") {
        beginJinchiSecret();
        return;
      }

      if (answer === "the doctrine of power") {
        window.location.href = "doctrine.html";
        return;
      }

      showResponse(getResponse(answer));
      input.select();
    });
  </script>
</body>
</html>
